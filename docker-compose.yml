services:
  webui:
    build: .
    user: "1000:1000"
    environment:
      - HOME=/home/cchv
    ports:
      - "127.0.0.1:3727:3727"
    volumes:
      # Session sources are mounted read-write so the UI's session delete /
      # rename features work; note deletes bypass the trash inside a container
      # (permanent removal).
      - ${HOME}/.claude:/home/cchv/.claude
      - ${HOME}/.codex:/home/cchv/.codex
      - ${HOME}/.local/share/opencode:/home/cchv/.local/share/opencode
      # Writable app data (user-data.json, token, settings) — bind-mounted to
      # host so it survives container recreation (docker compose up --build).
      - ${HOME}/.claude-history-viewer:/home/cchv/.claude-history-viewer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3727/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
